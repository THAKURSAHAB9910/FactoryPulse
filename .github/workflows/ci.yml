name: FactoryPulse CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-test:
    name: Backend & Data Engine Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data_engine/requirements.txt
          pip install -r backend/requirements.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: sqlite:///:memory:
          SECRET_KEY: test_secret_key_ci_2026
        run: |
          python -m pytest data_engine/tests backend/tests -v --tb=short

  frontend-build:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript Check & Vite Production Build
        working-directory: frontend
        run: npm run build
